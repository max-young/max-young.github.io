- name: Vehicle Software Delivery Platform
  slug: vehicle-software-delivery
  company: Rino.ai
  period: 2022–Present
  image: OTA.jpg
  url: ""
  oneliner: Fleet-scale SOTA/FOTA orchestration for autonomous vehicles
  role: Architecture owner and lead platform engineer in a three-person vehicle-platform team
  challenge: >
    R&D, factory, and fleet teams relied on separate delivery tools while vehicle count, software
    complexity, and map size were growing. Updates needed to remain observable and recoverable across
    unreliable networks, constrained vehicle storage, and distributed TBOX/ADCU nodes.
  contributions:
    - Defined the product direction and architecture for reusable vehicle-delivery infrastructure.
    - Architected and implemented a distributed FOTA MVP spanning orchestration, vehicle clients, backend services, web management, failure recovery, and power-loss safety.
    - Designed delivery strategies for software, configuration, and map datasets reaching hundreds of gigabytes.
    - Added resumable transfers, service-health monitoring, deployment automation, rollback safety, and version/state consistency.
  outcomes:
    - value: 30 → 10 min
      label: Average software deployment time
    - value: 200 → 5,000
      label: Supported vehicle deployment capacity
  technologies:
    - Python
    - Flask
    - React
    - Next.js
    - Celery
    - RabbitMQ
    - MQTT
    - MySQL
    - Linux

- name: Vehicle Calibration Platform
  slug: vehicle-calibration
  company: Rino.ai
  period: 2022–Present
  image: calibration.jpg
  url: ""
  oneliner: One calibration workflow for production lines and field operations
  role: End-to-end owner and lead developer
  challenge: >
    Sensor calibration was slow, fragmented, and communication-heavy. The process limited factory
    throughput and forced field teams to spend up to a full day completing work on one vehicle.
  contributions:
    - Built an automated workflow covering calibration execution, validation, and operational handoff.
    - Integrated Python and Shell orchestration with C++ and OpenCV-based calibration capabilities.
    - Designed the platform for both repeatable factory production and fast field maintenance.
  outcomes:
    - value: 2–3 → 30+
      label: Vehicles calibrated per factory day
    - value: 0.5–1 day → under 3 min
      label: Field calibration time per vehicle
  technologies:
    - Python
    - Shell
    - C++
    - OpenCV
    - Linux

